// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.25'
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def configuredBuildRoot = System.getenv("SJFC_ANDROID_BUILD_ROOT")
def workspaceBuildRoot = configuredBuildRoot ? file(configuredBuildRoot) : file("${rootDir}/../gtmp/android-build")
rootProject.layout.buildDirectory.set(workspaceBuildRoot)

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    layout.buildDirectory.set(new File(workspaceBuildRoot, project.name))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
